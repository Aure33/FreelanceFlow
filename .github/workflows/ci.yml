name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un seul workflow, deux blocs reliés dans la vue graphe de l'onglet Actions :
#   Bloc 1 (lint, build) → Bloc 2 (tests-unitaires, tests-integration, tests-e2e)
# Le bloc Tests ne démarre qu'une fois lint+build passés (via `needs`).
#
# tests-unitaires  : cœur métier pur (lib/invoicing), rapide, sans I/O ni secret.
# tests-integration: server actions + isolation RLS/userId contre un VRAI projet
#                    Supabase de test (réseau) → gated sur les secrets TEST_*.
# tests-e2e        : parcours navigateur Playwright, même gating.
# Les deux jobs « réseau » s'auto-désactivent proprement tant que les 5 secrets
# de test ne sont pas ajoutés au repo (#17) — jamais un faux vert silencieux.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Installer les dépendances
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Installer les dépendances
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build

  tests-unitaires:
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Installer les dépendances
        run: bun install --frozen-lockfile
      - name: Tests unitaires (bun test)
        run: bun test

  tests-integration:
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mêmes secrets de projet Supabase de TEST que l'E2E (jamais la prod).
      # Ces tests écrivent en base réelle et prouvent l'isolation `userId`/RLS
      # au niveau des server actions. Tant que les secrets sont absents (#17),
      # le job s'auto-désactive proprement au lieu d'échouer.
      - name: Vérifier la présence des secrets Supabase de test
        id: check-secrets
        run: |
          if [ -n "${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_URL }}" ] && \
             [ -n "${{ secrets.TEST_SUPABASE_SECRET_KEY }}" ] && \
             [ -n "${{ secrets.TEST_DATABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check-secrets.outputs.present == 'true'
        with:
          bun-version: latest

      - name: Installer les dépendances
        if: steps.check-secrets.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Tests d'intégration (server actions + isolation)
        if: steps.check-secrets.outputs.present == 'true'
        run: bun run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Intégration ignorée (secrets de test absents)
        if: steps.check-secrets.outputs.present == 'false'
        run: echo "Secrets Supabase de test absents (#17) — tests d'intégration ignorés pour le moment. Suites versionnées déjà prêtes (tests/integration/*.integration.ts)."

  tests-e2e:
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets d'un projet Supabase de TEST (jamais la prod) — pas encore
      # créés (#17). Tant qu'ils sont absents, le job s'auto-désactive
      # proprement au lieu d'échouer : le jour où #17/#33 ajoutent ces 5
      # secrets au repo, ce job se met à exécuter les specs versionnées
      # (tests/e2e/*.spec.ts) sans aucune autre modification à apporter ici.
      - name: Vérifier la présence des secrets Supabase de test
        id: check-secrets
        run: |
          if [ -n "${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_URL }}" ] && \
             [ -n "${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" ] && \
             [ -n "${{ secrets.TEST_SUPABASE_SECRET_KEY }}" ] && \
             [ -n "${{ secrets.TEST_DATABASE_URL }}" ] && \
             [ -n "${{ secrets.TEST_DIRECT_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check-secrets.outputs.present == 'true'
        with:
          bun-version: latest

      - name: Installer les dépendances
        if: steps.check-secrets.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Installer Chromium (Playwright)
        if: steps.check-secrets.outputs.present == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Tests E2E (bunx playwright test)
        if: steps.check-secrets.outputs.present == 'true'
        run: bunx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: E2E ignorés (secrets de test absents)
        if: steps.check-secrets.outputs.present == 'false'
        run: echo "Secrets Supabase de test absents (#17/#33) — E2E ignorés pour le moment. Spec versionnée déjà prête (ex. tests/e2e/documents-pdf.spec.ts)."
