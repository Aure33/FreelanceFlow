name: Build & Lint

on:
  pull_request:
  push:
    branches: [main]

# Qualité de code et compilation. Les tests sont dans un workflow séparé
# (.github/workflows/tests.yml) pour former un groupe distinct dans l'UI Actions.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Installer les dépendances
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Installer les dépendances
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
